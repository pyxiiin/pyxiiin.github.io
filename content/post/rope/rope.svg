  <polygon points="800,150 786,158 792,168" fill="#059669"/>
  <text x="808" y="146" font-size="13" fill="#047857" font-weight="bold">key · n</text>
  <line x1="690" y1="200" x2="760" y2="92" stroke="#2563eb" stroke-width="2.2"/>
  <polygon points="760,92 746,104 754,112" fill="#2563eb"/>
