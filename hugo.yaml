baseURL: https://pyxiiin.github.io/
locale: zh-cn
title: Xin P.Y.'s Homepage
theme: hugo-coder
defaultContentLanguage: zh-cn
hasCJKLanguage: true
enableEmoji: true

pagination:
  pagerSize: 10

permalinks:
  post: /p/:slug/

taxonomies:
  category: categories
  tag: tags

params:
  author: Xin P.Y.
  description: Xin P.Y.'s personal homepage and tech blog
  info:
    - 0 ERROR 0 WARNING
  dateFormat: "2006-01-02"
  since: 2026
  colorScheme: auto
  hideColorSchemeToggle: false
  customSCSS:
    - scss/custom.scss
  social:
    - name: GitHub
      icon: fa-brands fa-github fa-2x
      weight: 1
      url: https://github.com/pyxiiin

menu:
  main:
    - name: Blog
      url: post/
      weight: 1
    - name: Categories
      url: categories/
      weight: 2
    - name: Tags
      url: tags/
      weight: 3

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
