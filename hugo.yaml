baseURL: https://pyxiiin.github.io/
locale: zh-cn
title: Xin P.Y. 的技术博客
theme: hugo-coder
defaultContentLanguage: zh-cn
hasCJKLanguage: true
enableEmoji: true

pagination:
  pagerSize: 10

permalinks:
  post: /p/:slug/

taxonomies:
  category: categories
  tag: tags

params:
  author: Xin P.Y.
  description: Xin P.Y. 的技术博客
  info:
    - 记录技术、踩坑与成长
  dateFormat: "2006-01-02"
  since: 2026
  colorScheme: auto
  hideColorSchemeToggle: false
  social:
    - name: GitHub
      icon: fa-brands fa-github fa-2x
      weight: 1
      url: https://github.com/pyxiiin

menu:
  main:
    - name: 博客
      url: post/
      weight: 1
    - name: 分类
      url: categories/
      weight: 2
    - name: 标签
      url: tags/
      weight: 3

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
