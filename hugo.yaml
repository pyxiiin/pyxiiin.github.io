baseURL: https://pyxiiin.github.io/
locale: zh-cn
title: Xin P.Y. 的技术博客
theme: hugo-theme-stack
defaultContentLanguage: zh-cn
hasCJKLanguage: true

pagination:
  pagerSize: 10

permalinks:
  post: /p/:slug/
  page: /:slug/

params:
  mainSections:
    - post
  rssFullContent: true
  footer:
    since: 2026
  sidebar:
    emoji: "💻"
    subtitle: 记录技术、踩坑与成长
  article:
    toc: true
    readingTime: true
  widgets:
    homepage:
      - type: search
      - type: archives
        params:
          limit: 5
      - type: categories
        params:
          limit: 10
      - type: tag-cloud
        params:
          limit: 10
    page:
      - type: toc
  colorScheme:
    toggle: true
    default: auto

menu:
  main:
    - identifier: home
      name: 首页
      url: /
      weight: -100
      params:
        icon: home
  social:
    - identifier: github
      name: GitHub
      url: https://github.com/pyxiiin
      params:
        icon: brand-github

markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 4
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: true
    lineNumbersInTable: true
