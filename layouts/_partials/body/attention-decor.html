<div class="attn-decor attn-decor--left" aria-hidden="true">
  <div class="attn-decor__inner">
    <canvas class="attn-decor__canvas" data-seed="7"></canvas>
    <span class="attn-decor__label">head 07 / 128</span>
  </div>
</div>
<div class="attn-decor attn-decor--right" aria-hidden="true">
  <div class="attn-decor__inner">
    <canvas class="attn-decor__canvas" data-seed="93"></canvas>
    <span class="attn-decor__label">head 93 / 128</span>
  </div>
</div>
<script>
  (() => {
    const canvases = document.querySelectorAll(".attn-decor__canvas");
    if (!canvases.length) return;

    const N = 36; // 每边的块数
    const SINK = 2; // attention sink 列数
    const WINDOW = 2; // 滑动窗口带宽
    const SWEEP = 5600; // 扫描线走完一趟的时间
    const DECAY = 0.979; // 尾迹每帧的衰减

    // 0=未选中 1=sink/window 2=竖线 3=斜线 4=块
    // 静态结构刻意压暗，把视觉重心留给每趟新「发现」出来的动态图样
    const PALETTE = ["#8a8a8a", "#22c55e", "#06b6d4", "#a855f7", "#2dd4bf"];
    const PEAK = [0.16, 0.5, 0.95, 0.88, 1];
    const STATIC_A = 0.07; // 因果三角的常驻底图，保证扫描线回到顶部时画面不会空掉

    const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    const makeRand = (seed) => {
      let s = seed >>> 0 || 1;
      return () => {
        s ^= s << 13;
        s ^= s >>> 17;
        s ^= s << 5;
        return ((s >>> 0) % 100000) / 100000;
      };
    };

    const idx = (i, j) => i * N + j;

    const panels = [...canvases].map((canvas) => {
      const n = N * N;
      return {
        canvas,
        ctx: canvas.getContext("2d"),
        rand: makeRand(Number(canvas.dataset.seed) * 2654435761),
        level: new Float32Array(n), // 当前亮度，随时间衰减
        cat: new Uint8Array(n), // 类别，决定颜色
        px: 0,
        row: -1, // 扫描线已点亮到第几行
        phase: 0,
      };
    });

    // 一轮「瞬时模式发现」：决定这趟扫描里每个 query 块选中哪些 key 块
    const regenerate = (p) => {
      const { cat, rand } = p;
      cat.fill(0);

      for (let i = 0; i < N; i++) {
        for (let j = 0; j < SINK && j <= i; j++) cat[idx(i, j)] = 1;
        for (let d = 0; d < WINDOW; d++) {
          const j = i - d;
          if (j >= 0) cat[idx(i, j)] = 1;
        }
      }

      const vertical = 2 + Math.floor(rand() * 2);
      for (let v = 0; v < vertical; v++) {
        const j = SINK + Math.floor(rand() * (N - SINK));
        for (let i = j; i < N; i++) if (!cat[idx(i, j)]) cat[idx(i, j)] = 2;
      }

      const slashes = 1 + Math.floor(rand() * 2);
      for (let s = 0; s < slashes; s++) {
        const d = WINDOW + 3 + Math.floor(rand() * (N - WINDOW - 7));
        for (let i = d; i < N; i++) {
          const j = i - d;
          if (!cat[idx(i, j)]) cat[idx(i, j)] = 3;
        }
      }

      const blocks = 3 + Math.floor(rand() * 3);
      for (let b = 0; b < blocks; b++) {
        const i0 = Math.floor(rand() * (N - 3));
        const j0 = Math.floor(rand() * (i0 + 1));
        for (let i = i0; i < Math.min(i0 + 3, N); i++) {
          for (let j = j0; j < Math.min(j0 + 3, i + 1); j++) {
            if (!cat[idx(i, j)]) cat[idx(i, j)] = 4;
          }
        }
      }
    };

    // 扫描线推进到第 row 行：点亮该行
    const lightRow = (p, row) => {
      for (let j = 0; j <= row; j++) {
        const k = idx(row, j);
        p.level[k] = PEAK[p.cat[k]];
      }
    };

    const resize = (p) => {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const size = p.canvas.clientWidth;
      if (!size) return;
      p.canvas.width = p.canvas.height = Math.round(size * dpr);
      p.px = (size * dpr) / N;
    };

    const draw = (p) => {
      const { ctx, level, cat, px } = p;
      if (!px) return;
      const full = p.canvas.width;
      ctx.clearRect(0, 0, full, full);

      const gap = Math.max(1, px * 0.18);
      const side = px - gap;

      // 第一遍用 lighter 叠一圈放大的淡色方块，给亮块做出辉光
      ctx.globalCompositeOperation = "lighter";
      const halo = px * 0.75;
      for (let i = 0; i < N; i++) {
        for (let j = 0; j <= i; j++) {
          const k = idx(i, j);
          const a = level[k];
          if (a < 0.45) continue;
          ctx.globalAlpha = a * 0.16;
          ctx.fillStyle = PALETTE[cat[k]];
          ctx.fillRect(j * px - halo, i * px - halo, side + halo * 2, side + halo * 2);
        }
      }

      ctx.globalCompositeOperation = "source-over";
      for (let i = 0; i < N; i++) {
        for (let j = 0; j <= i; j++) {
          const k = idx(i, j);
          const a = level[k];
          const dim = a < STATIC_A;
          ctx.globalAlpha = dim ? STATIC_A : a;
          ctx.fillStyle = dim ? PALETTE[0] : PALETTE[cat[k]];
          ctx.fillRect(j * px, i * px, side, side);
        }
      }

      // 扫描线：亮线与尾迹都只画在因果三角内，避免在空白区留下游离的横杠
      const y = p.phase * N * px;
      const w = Math.min(full, y + px);
      const trail = px * 6;
      const grad = ctx.createLinearGradient(0, y - trail, 0, y);
      grad.addColorStop(0, "rgba(74, 222, 128, 0)");
      grad.addColorStop(1, "rgba(74, 222, 128, 0.12)");
      ctx.globalAlpha = 1;
      ctx.fillStyle = grad;
      ctx.fillRect(0, y - trail, w, trail);

      ctx.globalAlpha = 0.5;
      ctx.fillStyle = "#86efac";
      ctx.fillRect(0, y - Math.max(1, px * 0.12), w, Math.max(1, px * 0.12));
      ctx.globalAlpha = 1;
    };

    panels.forEach((p) => {
      resize(p);
      regenerate(p);
      if (reduced) {
        // 不播动画时直接把整张图样铺满
        for (let i = 0; i < N; i++) lightRow(p, i);
        p.phase = 1;
        draw(p);
      }
    });

    if (reduced) return;

    let raf = null;
    let last = 0;

    const frame = (now) => {
      raf = requestAnimationFrame(frame);
      const dt = last ? Math.min(now - last, 100) : 16;
      last = now;

      for (const p of panels) {
        p.phase += dt / SWEEP;
        if (p.phase >= 1) {
          p.phase -= 1;
          p.row = -1;
          // 换一套图样，但保留底部的余辉，让首尾两趟扫描无缝衔接
          regenerate(p);
        }

        const target = Math.floor(p.phase * N);
        while (p.row < target) lightRow(p, ++p.row);

        const d = Math.pow(DECAY, dt / 16.67);
        const { level } = p;
        for (let k = 0; k < level.length; k++) level[k] *= d;

        draw(p);
      }
    };

    const start = () => {
      if (raf === null) {
        last = 0;
        raf = requestAnimationFrame(frame);
      }
    };
    const stop = () => {
      if (raf !== null) cancelAnimationFrame(raf);
      raf = null;
    };

    document.addEventListener("visibilitychange", () => (document.hidden ? stop() : start()));
    if (window.ResizeObserver) {
      const ro = new ResizeObserver(() => panels.forEach(resize));
      panels.forEach((p) => ro.observe(p.canvas));
    } else {
      window.addEventListener("resize", () => panels.forEach(resize));
    }
    start();
  })();
</script>
