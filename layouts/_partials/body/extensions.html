{{/* 侧边装饰只出现在主页和列表页，文章正文页保留两侧留白 */}}
{{ if ne .Kind "page" }}
{{ partial "body/side-decor.html" . }}
{{ end }}
<style>
    .click-burst {
        position: fixed;
        inset: 0;
        z-index: 9999;
        pointer-events: none;
        user-select: none;
    }
</style>
<script>
    (() => {
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

        const GRAY = "156, 163, 175";
        const ACCENT = "34, 197, 94";
        const GRAVITY = 520; // px/s²
        const DRAG = 0.985; // 每 1/60 秒的速度衰减

        const canvas = document.createElement("canvas");
        canvas.className = "click-burst";
        document.body.appendChild(canvas);
        const ctx = canvas.getContext("2d");

        let dpr = 1;
        const resize = () => {
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = Math.round(innerWidth * dpr);
            canvas.height = Math.round(innerHeight * dpr);
        };
        resize();
        window.addEventListener("resize", resize);

        // 和两侧数字雨同一套字元：多数是 0/1，少数是实心小方块
        const makeGlyph = () => (Math.random() < 0.26 ? null : Math.random() < 0.5 ? "0" : "1");

        const particles = [];
        let raf = null;
        let prev = 0;

        const frame = (now) => {
            const dt = Math.min((now - prev) / 1000, 0.05);
            prev = now;

            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, innerWidth, innerHeight);
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            const drag = Math.pow(DRAG, dt * 60);

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.age += dt;
                if (p.age >= p.life) {
                    particles.splice(i, 1);
                    continue;
                }

                p.vy += GRAVITY * dt;
                p.vx *= drag;
                p.vy *= drag;
                p.x += p.vx * dt;
                p.y += p.vy * dt;

                // 飞行途中偶尔翻面，和数字雨的闪动呼应
                if (p.glyph !== null && Math.random() < 0.03) p.glyph = makeGlyph();

                const a = p.peak * Math.pow(1 - p.age / p.life, 1.6);
                ctx.fillStyle = `rgba(${p.accent ? ACCENT : GRAY}, ${a})`;
                if (p.glyph === null) {
                    const b = p.size * 0.46;
                    ctx.fillRect(p.x - b / 2, p.y - b / 2, b, b);
                } else {
                    ctx.font = `${p.size}px "JetBrains Mono", ui-monospace, monospace`;
                    ctx.fillText(p.glyph, p.x, p.y);
                }
            }

            if (particles.length) {
                raf = requestAnimationFrame(frame);
            } else {
                ctx.clearRect(0, 0, innerWidth, innerHeight);
                raf = null;
            }
        };

        document.addEventListener("click", (e) => {
            const n = 7 + Math.floor(Math.random() * 5);
            for (let i = 0; i < n; i++) {
                // 向上为主、左右张开的扇形
                const angle = -Math.PI / 2 + (Math.random() - 0.5) * 2.4;
                const speed = 90 + Math.random() * 170;
                particles.push({
                    x: e.clientX + (Math.random() - 0.5) * 8,
                    y: e.clientY + (Math.random() - 0.5) * 8,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    glyph: makeGlyph(),
                    size: 11 + Math.random() * 3,
                    peak: 0.45 + Math.random() * 0.35,
                    accent: Math.random() < 0.2,
                    age: 0,
                    life: 0.65 + Math.random() * 0.45,
                });
            }
            if (raf === null) {
                prev = performance.now();
                raf = requestAnimationFrame(frame);
            }
        });
    })();
</script>
